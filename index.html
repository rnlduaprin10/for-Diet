<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다이어터 맞춤 식단 & 대체 메뉴 챗봇</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center text-white text-xl font-bold shadow-sm">
                    🥗
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-800">다이어터 식단 챗봇</h1>
                    <p class="text-xs text-slate-500">맞춤 대체식품 & 외식 메뉴 가이드</p>
                </div>
            </div>
            
            <!-- 목표 선택 -->
            <div class="flex items-center space-x-2 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">
                <label for="dietGoal" class="text-xs font-semibold text-slate-600 hidden sm:inline">목표:</label>
                <select id="dietGoal" class="bg-transparent text-xs font-medium text-slate-800 focus:outline-none">
                    <option value="체지방 감량">🔥 체지방 감량</option>
                    <option value="근손실 방지 / 단백질 채우기">💪 근손실 방지</option>
                    <option value="저당 / 키토식단">🥑 저당 / 키토식단</option>
                    <option value="유지어터 / 식습관 개선">🥗 유지어터</option>
                </select>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col">

        <!-- 자주 묻는 질문 칩 버튼 -->
        <div class="mb-4">
            <p class="text-xs text-slate-500 mb-2 font-medium">✨ 자주 묻는 인기 추천 질문</p>
            <div class="flex flex-wrap gap-2">
                <button onclick="sendQuickQuery('떡볶이가 너무 먹고 싶은데 다이어트용 대체제 있어?')" 
                        class="bg-white border border-slate-200 hover:border-emerald-500 hover:text-emerald-600 text-slate-700 text-xs px-3 py-1.5 rounded-full transition shadow-sm">
                    🍢 떡볶이 대체제
                </button>
                <button onclick="sendQuickQuery('편의점에서 살 안찌고 맛있게 먹을 수 있는 조합 추천해줘')" 
                        class="bg-white border border-slate-200 hover:border-emerald-500 hover:text-emerald-600 text-slate-700 text-xs px-3 py-1.5 rounded-full transition shadow-sm">
                    🏪 편의점 꿀조합
                </button>
                <button onclick="sendQuickQuery('오늘 마라탕 먹으러 가는데 다이어트할 때 재료 뭐 골라야 해?')" 
                        class="bg-white border border-slate-200 hover:border-emerald-500 hover:text-emerald-600 text-slate-700 text-xs px-3 py-1.5 rounded-full transition shadow-sm">
                    🥘 마라탕 다이어트 조합
                </button>
                <button onclick="sendQuickQuery('오늘 회사 회식으로 삼겹살집 가는데 메뉴랑 팁 알려줘')" 
                        class="bg-white border border-slate-200 hover:border-emerald-500 hover:text-emerald-600 text-slate-700 text-xs px-3 py-1.5 rounded-full transition shadow-sm">
                    🥩 외식/회식 가이드
                </button>
            </div>
        </div>

        <!-- 채팅 메세지 창 -->
        <div id="chatBox" class="flex-1 bg-white border border-slate-200 rounded-2xl p-4 overflow-y-auto space-y-4 mb-4 shadow-sm min-h-[400px] max-h-[60vh]">
            <!-- 기본 웰컴 메시지 -->
            <div class="flex items-start space-x-3">
                <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 text-sm font-bold flex-shrink-0">
                    🤖
                </div>
                <div class="bg-slate-100 rounded-2xl rounded-tl-none px-4 py-3 text-slate-800 text-sm max-w-[85%] leading-relaxed">
                    안녕하세요! 당신의 전담 다이어트 영양사입니다.<br>
                    먹고 싶은 자극적인 음식의 대체제(키토/곤약/고단백 제품)나 외식·편의점 상황에서의 메뉴 가이드가 필요하면 무엇이든 물어보세요! 😉
                </div>
            </div>
        </div>

        <!-- 입력 폼 -->
        <form id="chatForm" onsubmit="handleFormSubmit(event)" class="relative flex items-center">
            <input type="text" id="userInput" placeholder="예: 서가앤쿡 가는데 뭐 먹을까? / 치킨 생각날 때 대체제 추천해줘" 
                   class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3.5 pr-12 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 shadow-sm transition">
            <button type="submit" id="sendBtn" 
                    class="absolute right-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg p-2.5 transition flex items-center justify-center">
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </form>
    </main>

    <script>
        // 백엔드 API 주소 (FastAPI 서버가 동작 중이어야 합니다)
        const BACKEND_URL = "http://127.0.0.1:8000/api/v1/recommend";

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const dietGoal = document.getElementById('dietGoal');

        // 메시지 전송 처리
        async function handleFormSubmit(e) {
            e.preventDefault();
            const query = userInput.value.trim();
            if (!query) return;

            // 유저 메시지 화면 추가
            appendUserMessage(query);
            userInput.value = '';

            // 로딩 표시
            const loadingId = appendLoadingMessage();

            try {
                // 백엔드 API 호출
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: "user_demo",
                        query: query,
                        diet_goal: dietGoal.value
                    })
                });

                if (!response.ok) {
                    throw new Error(`서버 에러 (${response.status})`);
                }

                const data = await response.json();
                
                // 로딩 제거 후 챗봇 응답 출력
                removeMessage(loadingId);
                appendBotResponse(data);

            } catch (error) {
                console.error("API Call Error:", error);
                removeMessage(loadingId);
                appendErrorMessage("백엔드 서버와 통신할 수 없습니다. FastAPI 서버(`uvicorn app.main:app --reload`)가 실행 중인지 확인해 주세요.");
            }
        }

        // 퀵 버튼 클릭 핸들러
        function sendQuickQuery(text) {
            userInput.value = text;
            handleFormSubmit(new Event('submit'));
        }

        // 화면 출력 함수들
        function appendUserMessage(text) {
            const msgHtml = `
                <div class="flex items-start justify-end space-x-3">
                    <div class="bg-emerald-500 text-white rounded-2xl rounded-tr-none px-4 py-3 text-sm max-w-[85%] leading-relaxed shadow-sm">
                        ${escapeHtml(text)}
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', msgHtml);
            scrollToBottom();
        }

        function appendBotResponse(data) {
            const recommendationsList = data.recommendations.map(item => `<li class="flex items-start space-x-2"><span class="text-emerald-500 font-bold">•</span><span>${escapeHtml(item)}</span></li>`).join('');

            const msgHtml = `
                <div class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 text-sm font-bold flex-shrink-0">
                        🤖
                    </div>
                    <div class="bg-slate-100 rounded-2xl rounded-tl-none px-4 py-3 text-slate-800 text-sm max-w-[85%] space-y-3 leading-relaxed border border-slate-200">
                        <div class="inline-block bg-emerald-100 text-emerald-700 font-semibold px-2.5 py-0.5 rounded text-xs">
                            ${escapeHtml(data.category)}
                        </div>
                        <p class="font-bold text-slate-900">${escapeHtml(data.summary)}</p>
                        
                        <div class="bg-white rounded-lg p-3 border border-slate-200 space-y-1.5">
                            <p class="text-xs font-bold text-slate-500 mb-1">💡 추천 선택지</p>
                            <ul class="space-y-1 text-slate-700">
                                ${recommendationsList}
                            </ul>
                        </div>

                        <div class="bg-amber-50 border border-amber-200 rounded-lg p-2.5 text-xs text-amber-800">
                            <strong>⚠️ 영양사의 팁:</strong> ${escapeHtml(data.tip)}
                        </div>
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', msgHtml);
            scrollToBottom();
        }

        function appendLoadingMessage() {
            const id = 'loading-' + Date.now();
            const msgHtml = `
                <div id="${id}" class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 text-sm font-bold flex-shrink-0">
                        🤖
                    </div>
                    <div class="bg-slate-100 rounded-2xl rounded-tl-none px-4 py-3 text-slate-500 text-sm flex items-center space-x-2">
                        <i class="fa-solid fa-circle-notch animate-spin text-emerald-500"></i>
                        <span>영양사가 식단을 분석하고 대안을 찾는 중입니다...</span>
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', msgHtml);
            scrollToBottom();
            return id;
        }

        function appendErrorMessage(text) {
            const msgHtml = `
                <div class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center text-red-500 text-sm font-bold flex-shrink-0">
                        ⚠️
                    </div>
                    <div class="bg-red-50 border border-red-200 rounded-2xl rounded-tl-none px-4 py-3 text-red-600 text-sm max-w-[85%]">
                        ${escapeHtml(text)}
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', msgHtml);
            scrollToBottom();
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
